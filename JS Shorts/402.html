<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>402</title>
</head>

<body>
    <form style="text-align: center;">
        <input id="elso" type="number">
        <button id="start" type="button" onclick="fussLe()">Start</button>
        <p id="eredmeny">szovegide</p>
    </form>
    <script>
        function fussLe() {
            let elso = parseInt(document.getElementById("elso").value)

            if (elso > 0) {
                document.getElementById("eredmeny").innerHTML = "+";
            }
            else if (elso == 0) {
                document.getElementById("eredmeny").innerHTML = "0";
            }
            else {
                document.getElementById("eredmeny").innerHTML = "-";
            }
        }
    </script>
</body>

</html>
