<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRZ Kód</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4 text-primary">MRZ Kód Ellenőrző</h2>
                        
                        <div class="mb-4">
                            <label for="fajlNev" class="form-label fw-bold">1/2. Feladat: MRZ fájl neve:</label>
                            <div class="input-group">
                                <input type="text" id="fajlNev" class="form-control" placeholder="pl.: mrz.txt">
                                <button class="btn btn-primary" id="fajlGomb">Fájl Beolvasása</button>
                            </div>
                            
                            <div class="mt-3 p-3 bg-white">
                                <div class="mb-2">
                                    <p>1. feladat:</p>
                                    <p id="elsoMegoldas"></p>
                                </div>
                                <div>
                                    <p>2. feladat:</p>
                                    <p id="masodikMegoldas"></p>
                                </div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="datumBe" class="form-label fw-bold">3. Feladat: Aktuális dátum (ÉÉHHNN):</label>
                            <div class="input-group">
                                <input type="text" id="datumBe" class="form-control" maxlength="6">
                                <button class="btn btn-success" id="datumGomb">Ellenőrzés</button>
                            </div>
                            
                            <div class="mt-3 p-3 bg-white">
                                <p>3. feladat:</p>
                                <p id="harmadikMegoldas"></p>
                            </div>
                        </div>

                        <div>
                            <div class="p-3 bg-white">
                                <p>4. feladat:</p>
                                <p id="negyedikMegoldas"></p>
                            </div>
                        </div>

                    </div>
                </div>
                
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
