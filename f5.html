<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javított Bootstrap Oldal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        #tabla {
            color: gray;
            max-height: 100px; 
        }
        .barna {
            background-color: brown;
            min-height: 100px;
        }
        .elem{
            min-height: 100px;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-1 bg-primary elem"></div>
            <div class="col-3 barna"></div>
            <div class="col-4 elem"></div>
            <div class="col-3 bg-dark elem" id="tabla"></div>
            <div class="col-1 elem"></div>
        </div>
        <div class="row">
            <div class="col-1 bg-primary elem"></div>
            <div class="col-10 elem"></div>
            <div class="col-1 elem barna"></div>
        </div>
        <div class="row">
            <div class="col-1 bg-primary elem"></div>
            <div class="col-3 elem barna"></div>
            <div class="col-2 elem"></div>
            <div class="col-3 elem barna"></div>
            <div class="col-3 elem barna"></div>
        </div>
        <div class="row">
            <div class="col-1 bg-primary elem"></div>
            <div class="col-5 elem"></div>
            <div class="col-3 elem barna"></div>
            <div class="col-3 elem barna"></div>
        </div>
        <div class="row">
            <div class="col-1 bg-primary elem"></div>
            <div class="col-3 elem barna"></div>
            <div class="col-8 elem"></div>
        </div>
        <div class="row">
            <div class="col-1 bg-primary elem"></div>
            <div class="col-11 elem"></div>
        </div>
            <div class="row">
            <div class="col-1 bg-primary elem"></div>
            <div class="col-3 elem barna"></div>
            <div class="col-2 elem"></div>
            <div class="col-3 elem barna"></div>
            <div class="col-3 elem barna"></div>
        </div>
        <div class="row">
            <div class="col-1 bg-primary elem"></div>
            <div class="col-11 elem"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
