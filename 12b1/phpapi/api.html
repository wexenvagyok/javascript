<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Számok Összeadása</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>

        #result {
            display: none;
            padding: 20px;
            background-color: red;
            color: white;
            margin-top: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2>Számok Összeadása</h2>
        <form id="Form">
            <div class="mb-1">
                <label for="numberA" class="form-label">Első szám</label>
                <input type="number" class="form-control" id="numberA" required>
            </div>
            <div class="mb-1">
                <label for="numberB" class="form-label">Második szám</label>
                <input type="number" class="form-control" id="numberB" required>
            </div>
            <button type="submit" class="btn btn-primary">Számolj</button>
        </form>

        <div id="result"></div>
    </div>

    <script>
        $(document).ready(function() {
            $('#Form').on('submit', function(e) {
                e.preventDefault();

                let a = $('#numberA').val();
                let b = $('#numberB').val();

                $.ajax({
                    url: 'miniapi.php',
                    type: 'GET',
                    data: { a: a, b: b },
                    success: function(response) {
                        $('#result').text('Eredmény: ' + response).show();
                    },
                });
            });
        });
    </script>
</body>
</html>
