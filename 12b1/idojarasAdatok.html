<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<script>
    fetch("idojarasAdatok.csv")
        .then(r => r.text())
        .then(text => {

            let sorok = text.trim().split("\n");

            let havonta = {};
            let osszeg = 0;

            sorok = sorok.slice(1)
            sorok.forEach(sor => {
                if (!sor.trim()) return;

                let mezok = sor.split(";");
                if (mezok.length < 3) return;

                let datum = mezok[0].trim();
                let mm = Number(mezok[2].replace("\r", "").trim());

                if (!isNaN(mm)) {
                    osszeg += mm;
                }

                let honap = datum.substring(0, 7).replace(".", "-");

                if (!havonta[honap]) {
                    havonta[honap] = 0;
                }

                havonta[honap] += mm;
            });

            // Havi bontásos kiíratás

            let html = "<table border='1' cellpadding='5'><tr><th>Hónap</th><th>Csapadék (mm)</th></tr>";

            for (let honap in havonta) {
                html += `
                    <tr>
                        <td>${honap}</td>
                        <td>${havonta[honap]}</td>
                    </tr>`;
            }

            html += "</table>";
            document.body.innerHTML += html;

            // Összesen mennyi eső esett
            const p = document.createElement("p");
            p.textContent = "Összes eső: " + osszeg + " mm";
            document.body.appendChild(p);
        });
</script>




</body>
</html>
