<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dolgozat</title>
    <style>
        td {
            padding: 0;
            font-size: 0;
        }

        table {
            border-spacing: 0;
            margin: auto;
        }
    </style>
</head>

<body>
    <!--A megadott html sablont kell használni, de azt csak javascripttel lehet bővíteni!
Az images.json-t kell feldolgozni, a benne lévő adatokat a megfelelő módon felhasználva, egy táblázatban kell megjeleníteni. A json-ban megadott adatokat használjátok, ne másoljátok ki onnan!
Tipp: a képnév 3 részből áll, a 2. nincs használva ebben a feladatban, a harmadik pedig a sorszám.-->
    <script>
        window.onload = betoltes;

        function betoltes() {
            fetch("images.json")
                .then(e => e.json())
                .then(adatok => {
                    const table = document.createElement("table");

                    const sorok = parseInt(adatok.tableSize.rows);
                    const oszlopok = parseInt(adatok.tableSize.cols);

                    let i = 0;

                    for (let r = 0; r < sorok; r++) {
                        const tr = document.createElement("tr");

                        for (let c = 0; c < oszlopok; c++) {
                            const td = document.createElement("td");

                            if (i < adatok.data.length) {
                                const elem = adatok.data[i];
                                const img = document.createElement("img");

                                img.src = adatok.baseurl + elem.src;
                                img.width = elem.size.widt;
                                img.height = elem.size.heigt;

                                td.appendChild(img);
                                i++;
                            }

                            tr.appendChild(td);
                        }

                        table.appendChild(tr);
                    }

                    document.body.appendChild(table);
                });
        }

    </script>
</body>

</html>
