<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Könnyebb</title>
    <style>
        table {
            border-collapse: collapse;
            margin: 20px;
            width: 80%;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>

    <button id="generateBtn">Playlist betöltése</button><br>

    <table id="lejatszas">
        <thead>
            <tr>
                <th>Kezdés</th>
                <th>Előadó</th>
                <th>Cím</th>
                <th>Hossz</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        document.getElementById('generateBtn').addEventListener('click', function () {

            fetch('playlist.json')
                .then(e => e.json())
                .then(data => {
                    const tbody = document.querySelector('#lejatszas tbody');
                    tbody.innerHTML = "";

                    data.forEach(track => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${track.start}</td>
                            <td>${track.artist}</td>
                            <td>${track.title}</td>
                            <td>${track.length}</td>
                        `;
                        tbody.appendChild(row);
                    });
                })
        });
    </script>

</body>
</html>
