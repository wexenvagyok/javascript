<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .keret{
        border: 1px solid black;
        display: inline-block;
    }

    div{
        text-align: center;
    }
</style>
<body onload="_masodik()">
    <label for="darab">Darab</label>
    <input type="range" name="darab" id="darab" min="1" max="100" value="1" onmouseup="harmadik(this)">
    <div id="eredmeny">

    </div>
    <script>
        function elso() {
            let xhttp = new XMLHttpRequest();

            xhttp.onload = function () {

                let json = JSON.parse(xhttp.response);

                console.log(json)
                console.log(json.results[0].name)
                let nev = json.results[0].name.title + " " + json.results[0].name.first + " " + json.results[0].name.last

                let szoveg = "";
                szoveg += "<h3>" + nev + "</h3>"
                szoveg += "<div class='kep'><img src='" + json.results[0].picture.large + "'>"


                document.getElementById("eredmeny").innerHTML = szoveg;
            }

            xhttp.open("GET", "https://randomuser.me/api/?nat=tr")
            xhttp.send();
        }

        function masodik() {
            let xhttp = new XMLHttpRequest();
            xhttp.onload = function () {
                let json = JSON.parse(xhttp.response);
                console.log(json);

                for (let i = 0; i < json.results.length; i++) {
                    let nev = json.results[i].name.title + " " + json.results[i].name.first + " " + json.results[i].name.last
                    let szoveg = "";
                    szoveg += "<h3>" + nev + "</h3>"
                    szoveg += "<div class='kep'><img src='" + json.results[i].picture.large + "'>"

                        document.getElementById("eredmeny").innerHTML+=szoveg;
                }
            }

            xhttp.open("GET", "https://randomuser.me/api/?results=5")
            xhttp.send();
        }

        function harmadik(e){
            console.log(e.value)
            document.getElementById("eredmeny").innerHTML="";


            let xhttp = new XMLHttpRequest();
            xhttp.onload = function () {
                let json = JSON.parse(xhttp.response);
                console.log(json);

                for (let i = 0; i < json.results.length; i++) {
                    let nev = json.results[i].name.title + " " + json.results[i].name.first + " " + json.results[i].name.last
                    let szoveg = "";

                    szoveg+="<div class='keret'>"
                    szoveg += "<h3>" + nev + "</h3>"
                    szoveg += "<div class='kep'><img src='" + json.results[i].picture.large + "'>"
                    szoveg += "<p>" + json.results[i].location.country + "</p>"
                    szoveg += "<p>" + json.results[i].cell + "</p>"
                        szoveg+="</div>"

                        document.getElementById("eredmeny").innerHTML+=szoveg;
                }
            }

            xhttp.open("GET", "https://randomuser.me/api/?results="+e.value)
            xhttp.send();
        }
    </script>
</body>

</html>
